server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers that have logging enabled
      - source_labels: ['__meta_docker_container_name']
        regex: '/owndatabase-.*'
        action: keep

      # Use container name as job
      - source_labels: ['__meta_docker_container_name']
        target_label: job
        regex: '/owndatabase-(.*)'
        replacement: '$1'

      # Use container name as service
      - source_labels: ['__meta_docker_container_name']
        target_label: service
        regex: '/owndatabase-(.*)'
        replacement: '$1'

      # Stream = stdout or stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            msg: msg
            time: time
            request_id: requestId
            service: service

      # Set log level label
      - labels:
          level:
          service:

      # Set timestamp from log
      - timestamp:
          source: time
          format: RFC3339Nano
          action_on_failure: skip
