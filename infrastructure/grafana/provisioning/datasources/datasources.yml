apiVersion: 1

# Older installs provisioned these without a fixed uid, so Grafana stored random
# ones and fails to update them ("data source not found"). Deleting by name
# first lets provisioning recreate them with the uids the dashboards expect.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    version: 1
    editable: false
