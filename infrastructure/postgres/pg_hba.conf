# pg_hba.conf — PostgreSQL Host-Based Authentication
#
# Security policy:
# - All connections must use scram-sha-256 authentication
# - Connections from Docker network (172.16.0.0/12) are allowed
# - No trust connections except local UNIX socket for pg_isready
# - Reject all other connections

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Allow local socket connections (for pg_isready health checks inside container)
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Allow connections from internal Docker network
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Reject all other connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::0/0                   reject
