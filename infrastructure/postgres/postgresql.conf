# PostgreSQL configuration for OwnDatabase
# Tuned for a small VPS (4GB RAM, 2-4 CPU)
# Adjust based on available resources.

# ─────────────────────────────────────────────────────────────────────────────
# CONNECTION SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

listen_addresses = '*'
port = 5432
max_connections = 100          # PgBouncer handles the pool, keep this low

# ─────────────────────────────────────────────────────────────────────────────
# MEMORY
# ─────────────────────────────────────────────────────────────────────────────

shared_buffers = 256MB          # ~25% of RAM for 1GB RAM VPS; increase for larger
effective_cache_size = 768MB    # ~75% of RAM
work_mem = 4MB                  # Per sort/hash, be conservative
maintenance_work_mem = 64MB     # For VACUUM, CREATE INDEX, etc.
wal_buffers = 16MB

# ─────────────────────────────────────────────────────────────────────────────
# WRITE-AHEAD LOG (WAL)
# ─────────────────────────────────────────────────────────────────────────────

wal_level = logical             # Required for logical replication (Realtime)
max_wal_senders = 10            # Max streaming replication connections
max_replication_slots = 10      # For logical replication slots
wal_keep_size = 1024MB          # Keep 1GB of WAL for replicas

# WAL archiving to the pgBackRest repository (point-in-time recovery).
# Until the pgbackrest sidecar has created the stanza, archive-push fails and
# PostgreSQL keeps the WAL locally and retries — nothing is lost.
archive_mode = on
archive_command = 'pgbackrest --stanza=owndatabase archive-push %p'
archive_timeout = 60            # Archive WAL segment at least every 60 seconds

# ─────────────────────────────────────────────────────────────────────────────
# CHECKPOINT
# ─────────────────────────────────────────────────────────────────────────────

checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 512MB

# ─────────────────────────────────────────────────────────────────────────────
# QUERY PLANNER
# ─────────────────────────────────────────────────────────────────────────────

random_page_cost = 1.1          # SSD-optimized (lower than default 4.0)
effective_io_concurrency = 200  # For SSD

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────────────────────

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
log_destination = 'stderr'
logging_collector = off         # Docker captures stderr
log_min_duration_statement = 1000  # Log queries slower than 1 second
log_checkpoints = on
log_connections = off           # Too verbose with PgBouncer
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '

# ─────────────────────────────────────────────────────────────────────────────
# AUTOVACUUM
# ─────────────────────────────────────────────────────────────────────────────

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY
# ─────────────────────────────────────────────────────────────────────────────

password_encryption = scram-sha-256

# ─────────────────────────────────────────────────────────────────────────────
# MISCELLANEOUS
# ─────────────────────────────────────────────────────────────────────────────

timezone = 'UTC'
default_text_search_config = 'pg_catalog.english'

# Enable parallel query
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
