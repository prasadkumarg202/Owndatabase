# OwnDatabase — `postgres` for the app when it runs on the Patroni cluster.
#
# Used by infrastructure/ha/docker-compose.ha-app.yml: this HAProxy takes the
# place of the single `postgres` service, so every service keeps connecting to
# postgres:5432 and always reaches the current primary. Patroni's REST API
# answers 200 on /primary only on the leader. On failover, sessions to the old
# primary are closed and clients (PgBouncer, realtime LISTEN) reconnect.
global
    maxconn 2000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    retries 2

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server pg1 pg1:5432 maxconn 600 check port 8008
    server pg2 pg2:5432 maxconn 600 check port 8008
    server pg3 pg3:5432 maxconn 600 check port 8008
