# OwnDatabase — HAProxy for Patroni (see docs/ha.md)
# Patroni's REST API (:8008) answers 200 on /primary only on the leader and
# 200 on /replica only on healthy streaming replicas; HAProxy uses that.
global
    maxconn 1000

# Re-resolve node names: a restarted node can come back with a new IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    retries 2
    default-server init-addr last,libc,none resolvers docker

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server pg1 pg1:5432 maxconn 300 check port 8008
    server pg2 pg2:5432 maxconn 300 check port 8008
    server pg3 pg3:5432 maxconn 300 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica?lag=10MB
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
    server pg1 pg1:5432 maxconn 300 check port 8008
    server pg2 pg2:5432 maxconn 300 check port 8008
    server pg3 pg3:5432 maxconn 300 check port 8008
