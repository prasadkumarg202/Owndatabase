# pgBackRest — cluster backups + WAL archive for point-in-time recovery.
#
# Mounted into both the `postgres` service (archive-push from archive_command)
# and the `pgbackrest` sidecar (backups, restore). Both share the data volume,
# the Unix socket directory and the repository volume, so no SSH is needed.
#
# The repository is encrypted: the passphrase comes from the environment
# (PGBACKREST_REPO1_CIPHER_PASS, set from PGBACKREST_CIPHER_PASS in .env).
# Losing it makes every backup unreadable — store it with your other secrets.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-diff=7
compress-type=lz4
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
lock-path=/tmp/pgbackrest

[global:archive-push]
process-max=2

[owndatabase]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
